name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Lint (ruff)
        run: uv run ruff check packages tests examples
      - name: Architecture contracts (import-linter, AD-1)
        run: uv run lint-imports
      - name: Tests (pytest)
        run: uv run pytest -q 2>&1 | tee pytest.out; exit ${PIPESTATUS[0]}
      - name: Publish failure log (self-reporting)
        if: failure()
        run: |
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git checkout -B "ci-logs/${{ github.run_id }}-py${{ matrix.python-version }}"
          mkdir -p .ci-logs
          cp pytest.out ".ci-logs/py${{ matrix.python-version }}.out"
          git add .ci-logs
          git commit -m "CI 失败日志 run=${{ github.run_id }} py${{ matrix.python-version }}"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:ci-logs/${{ github.run_id }}-py${{ matrix.python-version }}"
