[project]
name = "vasta-adapters"
version = "0.1.0"
description = "Model/Environment/Tool/Storage adapter implementations"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["vasta-protocols"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vasta_adapters"]
