[project]
name = "vasta-contracts"
version = "0.1.0"
description = "ActionContract templates and verifier protocol implementations (Epic 3)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["vasta-protocols", "pydantic>=2.13,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vasta_contracts"]
