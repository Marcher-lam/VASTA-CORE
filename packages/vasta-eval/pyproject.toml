[project]
name = "vasta-eval"
version = "0.1.0"
description = "Ablations, gates, repro bundles (Epic 7)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["vasta-protocols", "pydantic>=2.13,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vasta_eval"]
