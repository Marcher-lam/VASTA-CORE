[project]
name = "vasta-model-lab"
version = "0.1.0"
description = "Sandbox, replay, property tests, planning (Epic 6)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["vasta-protocols", "pydantic>=2.13,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vasta_model_lab"]
