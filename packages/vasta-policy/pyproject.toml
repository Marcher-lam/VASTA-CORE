[project]
name = "vasta-policy"
version = "0.1.0"
description = "Policy engine, risk tiers, autonomy levels (Epic 3)"
requires-python = ">=3.12"
dependencies = ["vasta-protocols"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vasta_policy"]
