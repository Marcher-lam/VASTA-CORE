[project]
name = "vasta-protocols"
version = "0.1.0"
description = "VastaCore protocol root: event envelope, five adapter protocols, contract test suites"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.13,<3",
    "uuid6>=2024.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vasta_protocols"]
