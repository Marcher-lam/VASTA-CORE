[project]
name = "vasta-storage"
version = "0.1.0"
description = "Evidence Store: CAS, event store, derived index, lifecycle (Epic 1/2)"
requires-python = ">=3.12"
dependencies = ["vasta-protocols"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vasta_storage"]
