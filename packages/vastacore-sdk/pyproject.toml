[project]
name = "vastacore-sdk"
version = "0.1.0"
description = "Assembly entrypoint and convenience API (AD-1 composition root)"
requires-python = ">=3.12"
dependencies = [
    "vasta-protocols",
    "vasta-runtime",
    "vasta-storage",
    "vasta-adapters",
    "pydantic>=2.13,<3",
    "typer>=0.12",
    "fastapi>=0.115,<0.142",
    "uvicorn>=0.30",
]

[project.scripts]
vasta = "vastacore.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vastacore"]
