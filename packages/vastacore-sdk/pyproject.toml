[project]
name = "vastacore-sdk"
version = "0.1.0"
description = "Assembly entrypoint and convenience API (AD-1 composition root)"
requires-python = ">=3.12"
dependencies = ["vasta-protocols"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vastacore"]
